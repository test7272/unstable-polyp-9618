name: Deploy to Azure Container Apps
"on":
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy@v1
        with:
          acrName: chaosregistry
          containerAppName: chaos-app
          resourceGroup: chaos-rg
          imageToBuild: ${{ secrets.AZURE_CONTAINER_IMAGE }}
          targetPort: 8080
