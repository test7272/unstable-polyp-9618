name: Languages
"on":
  push:
  pull_request:

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"
      - uses: julia-actions/setup-julia@v2
      - uses: r-lib/actions/setup-r@v2
      - name: Install toolchains (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl lua5.4 sqlite3 groovy clisp guile-3.0 racket gforth gfortran ocaml-nox ghc elixir erlang zsh gnat fpc valac swi-prolog
      - name: Ada
        run: gnatmake languages/ada/dyxyqogi.adb -o /tmp/hello_ada && /tmp/hello_ada
        continue-on-error: true
      - name: Awk
        run: awk -f languages/awk/pegy.awk /dev/null
        continue-on-error: true
      - name: Brainfuck
        run: python3 tools/bf.py languages/brainfuck/hello.bf
        continue-on-error: true
      - name: C
        run: gcc languages/c/vuduhi.c -o /tmp/hello_c && /tmp/hello_c
        continue-on-error: true
      - name: C#
        run: cd languages/csharp && dotnet run
        continue-on-error: true
      - name: C++
        run: g++ languages/cpp/tolu.cpp -o /tmp/hello_cpp && /tmp/hello_cpp
        continue-on-error: true
      - name: Common Lisp
        run: clisp languages/lisp/dikifihu.lisp
        continue-on-error: true
      - name: Elixir
        run: elixir languages/elixir/rebi.ex
        continue-on-error: true
      - name: Erlang
        run: escript languages/erlang/zali.erl
        continue-on-error: true
      - name: F#
        run: cd languages/fsharp && dotnet fsi kyxody.fs
        continue-on-error: true
      - name: Forth
        run: gforth languages/forth/tykuceki.fth -e bye
        continue-on-error: true
      - name: Fortran
        run: gfortran languages/fortran/kyqylo.f90 -o /tmp/hello_f90 && /tmp/hello_f90
        continue-on-error: true
      - name: Go
        run: cd languages/go && go run bagaxy.go
        continue-on-error: true
      - name: Groovy
        run: groovy languages/groovy/leroguji.groovy
        continue-on-error: true
      - name: Haskell
        run: runghc languages/haskell/jyfi.hs
        continue-on-error: true
      - name: Java
        run: java languages/java/pumitu.java
        continue-on-error: true
      - name: JavaScript
        run: node languages/javascript/tuzu.js
        continue-on-error: true
      - name: Julia
        run: julia languages/julia/hafo.jl
        continue-on-error: true
      - name: Lua
        run: lua5.4 languages/lua/satoja.lua
        continue-on-error: true
      - name: OCaml
        run: ocaml languages/ocaml/kinoni.ml
        continue-on-error: true
      - name: Pascal
        run: fpc languages/pascal/vikusilo.pas -o/tmp/hello_pas >/dev/null && /tmp/hello_pas
        continue-on-error: true
      - name: Perl
        run: perl languages/perl/meweza.pl
        continue-on-error: true
      - name: PHP
        run: php languages/php/jibewali.php
        continue-on-error: true
      - name: Prolog
        run: swipl -q -g "main" -t halt -f languages/prolog/fixyka.pro
        continue-on-error: true
      - name: Python
        run: python3 languages/python/jyru.py
        continue-on-error: true
      - name: R
        run: Rscript languages/r/jimalado.R
        continue-on-error: true
      - name: Racket
        run: racket languages/racket/bawo.rkt
        continue-on-error: true
      - name: Ruby
        run: ruby languages/ruby/cavixelu.rb
        continue-on-error: true
      - name: Rust
        run: rustc languages/rust/cyliwysa.rs -o /tmp/hello_rs && /tmp/hello_rs
        continue-on-error: true
      - name: Scheme
        run: guile languages/scheme/viwyfada.scm
        continue-on-error: true
      - name: sed
        run: echo foo | sed -f languages/sed/pomaboqa.sed
        continue-on-error: true
      - name: Shell
        run: bash languages/shell/moqy.sh
        continue-on-error: true
      - name: SQL
        run: sqlite3 :memory: < languages/sql/waxico.sql
        continue-on-error: true
      - name: Tcl
        run: tclsh languages/tcl/gyjuqega.tcl
        continue-on-error: true
      - name: TypeScript
        run: cd languages/typescript && npx --yes tsc kely.ts && node kely.js
        continue-on-error: true
      - name: Vala
        run: valac languages/vala/niciqe.vala -o /tmp/hello_vala && /tmp/hello_vala
        continue-on-error: true
      - name: Visual Basic .NET
        run: cd languages/vb && dotnet run
        continue-on-error: true
