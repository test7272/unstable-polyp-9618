name: Stale bot
"on":
  schedule:
    - cron: "0 12 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been inactive for 90 days. It will be closed if no activity occurs."
          stale-pr-message: "This PR has been inactive for 60 days. It will be closed if no activity occurs."
          days-before-issue-stale: 90
          days-before-pr-stale: 60
          days-before-issue-close: -1
          days-before-pr-close: -1
