[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaos"
version = "0.1.0"
description = "Depends on everything"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "numpy",
  "flask",
  "rich",
  "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
